# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# Dareful indexer: DarefulLedger and DarefulDares on Monad testnet (10143).
# Every event in PLANNING.md section 5a. Syncs from HyperSync (ENVIO_API_TOKEN in indexer/.env) from the deployment block.
name: dareful-indexer
description: Dareful social ledger and markets on Monad
disable_default_cross_chain: true
field_selection:
  transaction_fields:
    - hash
chains:
  - id: 10143
    start_block: 63431111
    # Redeployed 2026-09-17 with truncation settlement; addresses and start block match .env.local.
    contracts:
      - name: DarefulLedger
        address:
          - "0x8E200d344fA233d85b78f85aC78c3F778397F26D"
        events:
          - event: Confirmed(bytes32 indexed groupId, bytes32 indexed denomId, address indexed debtor, address creditor, uint256 id, uint256 qty, bytes16 obligationId, bool unique)
          - event: Closed(uint256 indexed id, address indexed creditor, uint256 qty, uint8 reason, bytes16 obligationId)
          - event: Netted(bytes32 indexed groupId, bytes32 indexed denomId, address a, address b, uint256 qty)
          - event: GroupCreated(bytes32 indexed groupId, address[] ledgers, address[] governances)
          - event: MemberAdded(bytes32 indexed groupId, address ledger, address governance)
          - event: DenomCreated(bytes32 indexed groupId, bytes32 indexed denomId, bool quantifiable)
      - name: DarefulDares
        address:
          - "0xd621c7770B96d2bF94638a28A15B3636cC0a3Fa0"
        events:
          - event: DareCreated(bytes32 indexed dareId, bytes32 indexed groupId, uint8 kind, uint8 pace, address creator, bytes32 termsHash, bytes32 denomId, uint256 range, uint8 options, uint8 stalemate, uint64 resolvesBy)
          - event: Entered(bytes32 indexed dareId, address participant, uint256 stake, uint256 value, uint16 confidenceBps)
          - event: DareVoided(bytes32 indexed dareId, uint8 votes)
          - event: DareResolved(bytes32 indexed dareId, uint256 outcome, uint8 votes)
          - event: DareArbitrated(bytes32 indexed dareId, uint256 outcome, bool voided, bytes32 rulingHash)
          - event: DareExpired(bytes32 indexed dareId)
          - event: Scored(bytes32 indexed dareId, address participant, uint16 score)
